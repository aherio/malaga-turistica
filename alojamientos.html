<script>
function desplazar(idCarrusel, direccion) {
    const contenedor = document.getElementById(idCarrusel);
    if (contenedor) {
        const anchoItem = contenedor.offsetWidth;
        contenedor.scrollBy({
            left: anchoItem * direccion,
            behavior: 'smooth'
        });
    }
}
</script>
