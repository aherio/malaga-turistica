<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <title>Estructura Flexbox Adaptativa</title>
    <link rel="stylesheet" href="css/style_aloj.css">
</head>
<body>

    <header class="bloque bloque-1">

<div class="contenedor-inicio">

    <div class="contenedor-galerias">  
        
        <div class="seccion-alquiler">
            <div class="boton-navbar-individual">TORROX</div>
            
            <div class="carrusel-bloque">
                <button class="flecha flecha-izq" onclick="desplazar('carrusel-torrox', -1)">&#10094;</button>

                <div class="carrusel-contenedor" id="carrusel-torrox">
                    <div class="carrusel-track">
                        <div class="carrusel-item"><img src="img/TORROX/1.jpeg" alt="Torrox 1"></div>
                        <div class="carrusel-item"><img src="img/TORROX/2.jpeg" alt="Torrox 2"></div>
                        <div class="carrusel-item"><img src="img/TORROX/3.jpeg" alt="Torrox 3"></div>
                        <div class="carrusel-item"><img src="img/TORROX/4.jpeg" alt="Torrox 1"></div>
                        <div class="carrusel-item"><img src="img/TORROX/5.jpeg" alt="Torrox 2"></div>
                        <div class="carrusel-item"><img src="img/TORROX/6.jpeg" alt="Torrox 3"></div>

                        <div class="carrusel-item"><img src="img/TORROX/14.jpeg" alt="Torrox 3"></div>
                    </div>
                </div>
            </div>
        </div> <div class="seccion-alquiler">
            <div class="boton-navbar-individual">RINCON</div>
           
            <div class="carrusel-bloque">
                <button class="flecha flecha-izq" onclick="desplazar('carrusel-rincon', -1)">&#10094;</button>
                <button class="flecha flecha-der" onclick="desplazar('carrusel-rincon', 1)">&#10095;</button>
                
                <div class="carrusel-contenedor" id="carrusel-rincon">
                    <div class="carrusel-track">
                        <div class="carrusel-item"><img src="img/RINCON/2.jpeg" alt="Rincón 1"></div>
                        <div class="carrusel-item"><img src="img/RINCON/3.jpeg" alt="Rincón 2"></div>
                        <div class="carrusel-item"><img src="img/RINCON/4.jpeg" alt="Rincón 3"></div>
                        <div class="carrusel-item"><img src="img/RINCON/5.jpeg" alt="Rincón 1"></div>
                        <div class="carrusel-item"><img src="img/RINCON/6.jpeg" alt="Rincón 2"></div>
                        <div class="carrusel-item"><img src="img/RINCON/7.jpeg" alt="Rincón 3"></div>
                        <div class="carrusel-item"><img src="img/RINCON/8.jpeg" alt="Rincón 2"></div>
                        <div class="carrusel-item"><img src="img/RINCON/9.jpeg" alt="Rincón 3"></div>
                    </div>
                </div>
            </div>
        </div> </div> <script>
    function desplazar(idCarrusel, direccion) {
        const contenedor = document.getElementById(idCarrusel);
        if (contenedor) {
            const anchoItem = contenedor.offsetWidth;
            contenedor.scrollBy({
                left: anchoItem * direccion,
                behavior: 'smooth'
            });
        }
    }
    </script>

</html>
